# Local development stack: Next.js app + PostgreSQL + Redis.
#
# On Coolify you do NOT use this file for the DB/cache — you either attach
# Coolify's managed Postgres/Redis (Option A) or deploy docker-compose.prod.yml
# (Option B). See README.md.
#
# Usage:
#   npm run docker:up        (build + start in background)
#   npm run docker:up:logs   (foreground with logs)
#   open http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trendscore}
      POSTGRES_USER: ${POSTGRES_USER:-trendscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trendscorepass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trendscore} -d ${POSTGRES_DB:-trendscore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be present at BUILD time to be inlined.
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
        NEXT_PUBLIC_FREEMIUS_STORE_ID: "${NEXT_PUBLIC_FREEMIUS_STORE_ID:-}"
        NEXT_PUBLIC_FREEMIUS_PRO_PRICING_ID: "${NEXT_PUBLIC_FREEMIUS_PRO_PRICING_ID:-85687}"
        # Browser WebSocket gateway URL (inlined into the client bundle).
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}"
        # Cloudflare Turnstile site key (inlined into the client bundle).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Point at the compose services on the internal network.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-trendscore}:${POSTGRES_PASSWORD:-trendscorepass}@db:5432/${POSTGRES_DB:-trendscore}?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}"
      NEXT_PUBLIC_MAINTENANCE_MODE: ${NEXT_PUBLIC_MAINTENANCE_MODE:-false}
      NODE_ENV: production
      # Auth (from .env)
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      # OAuth providers (from .env) — buttons enable only when both keys are set.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      # Cloudflare Turnstile (site key inlined at build; secret verified server-side).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      # Freemius (from .env)
      FREEMIUS_PRODUCT_ID: "${FREEMIUS_PRODUCT_ID:-}"
      FREEMIUS_PUBLIC_KEY: "${FREEMIUS_PUBLIC_KEY:-}"
      FREEMIUS_SECRET_KEY: "${FREEMIUS_SECRET_KEY:-}"
      FREEMIUS_API_KEY: "${FREEMIUS_API_KEY:-}"
      NEXT_PUBLIC_FREEMIUS_STORE_ID: "${NEXT_PUBLIC_FREEMIUS_STORE_ID:-}"
      NEXT_PUBLIC_FREEMIUS_PRO_PRICING_ID: "${NEXT_PUBLIC_FREEMIUS_PRO_PRICING_ID:-85687}"
    ports:
      - "3000:3000"

  # Market ingestion & analysis worker. Streams Binance Futures klines, keeps
  # Redis sliding windows, publishes live ticks / closed candles / signals /
  # AI analyses that the ws-gateway fans out.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-trendscore}:${POSTGRES_PASSWORD:-trendscorepass}@db:5432/${POSTGRES_DB:-trendscore}?schema=public"
      REDIS_URL: "redis://redis:6379"
      BINANCE_USE_TESTNET: "${BINANCE_USE_TESTNET:-false}"
      TRACKED_SYMBOLS: "${TRACKED_SYMBOLS:-}"

  # Client WebSocket gateway. Holds browser connections, verifies the NextAuth
  # JWT, and fans out Redis Pub/Sub with Free/Pro channel authorization.
  ws-gateway:
    build:
      context: .
      dockerfile: Dockerfile.ws
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-trendscore}:${POSTGRES_PASSWORD:-trendscorepass}@db:5432/${POSTGRES_DB:-trendscore}?schema=public"
      REDIS_URL: "redis://redis:6379"
      WS_GATEWAY_PORT: "3001"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      # Freemius creds so the gateway can resolve Pro plans (else the SDK throws
      # and every user is safely downgraded to FREE).
      FREEMIUS_PRODUCT_ID: "${FREEMIUS_PRODUCT_ID:-}"
      FREEMIUS_PUBLIC_KEY: "${FREEMIUS_PUBLIC_KEY:-}"
      FREEMIUS_SECRET_KEY: "${FREEMIUS_SECRET_KEY:-}"
      FREEMIUS_API_KEY: "${FREEMIUS_API_KEY:-}"
      NEXT_PUBLIC_FREEMIUS_STORE_ID: "${NEXT_PUBLIC_FREEMIUS_STORE_ID:-}"
      NEXT_PUBLIC_FREEMIUS_PRO_PRICING_ID: "${NEXT_PUBLIC_FREEMIUS_PRO_PRICING_ID:-85687}"
    ports:
      - "3001:3001"

volumes:
  db_data:
  redis_data:
